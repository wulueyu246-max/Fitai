name: fit_ai
description: Shupi - AI intelligent styling assistant.
publish_to: "none"
version: 1.5.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  image_picker: ^1.2.3
  # Stable 11.x requires win32 5.x, while the existing geolocator stack uses
  # win32 6.x. This is the first upstream version compatible with both.
  file_picker: 12.0.0-beta.7
  shared_preferences: ^2.5.5
  file_saver: ^0.4.0
  share_plus: ^13.3.0
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/home/
    - assets/images/products/
